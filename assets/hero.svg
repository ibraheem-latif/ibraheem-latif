<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Player 1: Ibraheem Latif">
  <defs>
    <style>
      .px { shape-rendering: crispEdges; }
      .t { font-family: "Courier New", Courier, monospace; font-weight: 700; fill: #e8f5e9; }
    </style>
  </defs>
  <!-- background -->
  <rect width="840" height="220" fill="#0b0f1a"/>
  <!-- scanlines -->
  <g opacity="0.12">
    <rect y="0" width="840" height="2" fill="#000"/><rect y="4" width="840" height="2" fill="#000"/><rect y="8" width="840" height="2" fill="#000"/><rect y="12" width="840" height="2" fill="#000"/><rect y="16" width="840" height="2" fill="#000"/><rect y="20" width="840" height="2" fill="#000"/><rect y="24" width="840" height="2" fill="#000"/><rect y="28" width="840" height="2" fill="#000"/><rect y="32" width="840" height="2" fill="#000"/><rect y="36" width="840" height="2" fill="#000"/><rect y="40" width="840" height="2" fill="#000"/><rect y="44" width="840" height="2" fill="#000"/><rect y="48" width="840" height="2" fill="#000"/><rect y="52" width="840" height="2" fill="#000"/><rect y="56" width="840" height="2" fill="#000"/><rect y="60" width="840" height="2" fill="#000"/><rect y="64" width="840" height="2" fill="#000"/><rect y="68" width="840" height="2" fill="#000"/><rect y="72" width="840" height="2" fill="#000"/><rect y="76" width="840" height="2" fill="#000"/><rect y="80" width="840" height="2" fill="#000"/><rect y="84" width="840" height="2" fill="#000"/><rect y="88" width="840" height="2" fill="#000"/><rect y="92" width="840" height="2" fill="#000"/><rect y="96" width="840" height="2" fill="#000"/><rect y="100" width="840" height="2" fill="#000"/><rect y="104" width="840" height="2" fill="#000"/><rect y="108" width="840" height="2" fill="#000"/><rect y="112" width="840" height="2" fill="#000"/><rect y="116" width="840" height="2" fill="#000"/><rect y="120" width="840" height="2" fill="#000"/><rect y="124" width="840" height="2" fill="#000"/><rect y="128" width="840" height="2" fill="#000"/><rect y="132" width="840" height="2" fill="#000"/><rect y="136" width="840" height="2" fill="#000"/><rect y="140" width="840" height="2" fill="#000"/><rect y="144" width="840" height="2" fill="#000"/><rect y="148" width="840" height="2" fill="#000"/><rect y="152" width="840" height="2" fill="#000"/><rect y="156" width="840" height="2" fill="#000"/><rect y="160" width="840" height="2" fill="#000"/><rect y="164" width="840" height="2" fill="#000"/><rect y="168" width="840" height="2" fill="#000"/><rect y="172" width="840" height="2" fill="#000"/><rect y="176" width="840" height="2" fill="#000"/><rect y="180" width="840" height="2" fill="#000"/><rect y="184" width="840" height="2" fill="#000"/><rect y="188" width="840" height="2" fill="#000"/><rect y="192" width="840" height="2" fill="#000"/><rect y="196" width="840" height="2" fill="#000"/><rect y="200" width="840" height="2" fill="#000"/><rect y="204" width="840" height="2" fill="#000"/><rect y="208" width="840" height="2" fill="#000"/><rect y="212" width="840" height="2" fill="#000"/><rect y="216" width="840" height="2" fill="#000"/>
  </g>
  <!-- twinkling stars -->
  <g class="px" fill="#cfd8dc">
    <rect x="40" y="30" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="120" y="70" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="210" y="20" width="3" height="3"><animate attributeName="opacity" values="1;0.1;1" dur="2.9s" repeatCount="indefinite"/></rect>
    <rect x="300" y="150" width="2" height="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="380" y="40" width="3" height="3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="470" y="180" width="2" height="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="560" y="25" width="3" height="3"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="640" y="90" width="2" height="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="720" y="160" width="3" height="3"><animate attributeName="opacity" values="1;0.1;1" dur="2.6s" repeatCount="indefinite"/></rect>
    <rect x="790" y="50" width="2" height="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></rect>
    <rect x="660" y="200" width="2" height="2"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <rect x="90" y="190" width="2" height="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></rect>
  </g>
  <!-- ground -->
  <rect x="0" y="196" width="840" height="24" fill="#1b2a1f" class="px"/>
  <g class="px" fill="#2e7d32">
    <rect x="0" y="196" width="840" height="4"/>
  </g>
  <!-- pixel bot (original sprite), bobbing -->
  <g class="px" transform="translate(690,116)">
    <animateTransform attributeName="transform" type="translate" values="690,116;690,110;690,116" dur="1s" repeatCount="indefinite"/>
    <!-- antenna -->
    <rect x="22" y="0" width="4" height="8" fill="#80deea"/>
    <rect x="20" y="-4" width="8" height="4" fill="#ff5252">
      <animate attributeName="fill" values="#ff5252;#ffeb3b;#ff5252" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <!-- head -->
    <rect x="8" y="8" width="32" height="24" fill="#90caf9"/>
    <rect x="8" y="8" width="32" height="4" fill="#bbdefb"/>
    <!-- eyes -->
    <rect x="14" y="16" width="6" height="6" fill="#0b0f1a">
      <animate attributeName="height" values="6;6;1;6;6" keyTimes="0;0.9;0.93;0.96;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="16" width="6" height="6" fill="#0b0f1a">
      <animate attributeName="height" values="6;6;1;6;6" keyTimes="0;0.9;0.93;0.96;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- mouth -->
    <rect x="18" y="26" width="12" height="3" fill="#0b0f1a"/>
    <!-- body -->
    <rect x="4" y="34" width="40" height="28" fill="#42a5f5"/>
    <rect x="4" y="34" width="40" height="4" fill="#64b5f6"/>
    <rect x="16" y="42" width="16" height="10" fill="#0b0f1a"/>
    <rect x="18" y="44" width="4" height="2" fill="#69f0ae">
      <animate attributeName="width" values="4;12;4" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="48" width="8" height="2" fill="#69f0ae">
      <animate attributeName="width" values="8;3;8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- arms -->
    <rect x="-4" y="38" width="8" height="18" fill="#1e88e5"/>
    <rect x="44" y="38" width="8" height="18" fill="#1e88e5"/>
    <!-- legs -->
    <rect x="10" y="62" width="10" height="14" fill="#1565c0"/>
    <rect x="28" y="62" width="10" height="14" fill="#1565c0"/>
  </g>
  <!-- title -->
  <text x="40" y="78" class="t" font-size="34" letter-spacing="2">IBRAHEEM LATIF</text>
  <text x="40" y="108" class="t" font-size="16" fill="#80deea" letter-spacing="1">AI ENGINEER  ·  AGENTS  ·  EVALS</text>
  <!-- health bar -->
  <text x="40" y="146" class="t" font-size="12" fill="#9e9e9e">LVL 7 ENGINEER</text>
  <rect x="40" y="154" width="240" height="14" fill="#263238" class="px"/>
  <rect x="42" y="156" width="0" height="10" fill="#69f0ae" class="px">
    <animate attributeName="width" values="0;236" dur="2.5s" fill="freeze"/>
  </rect>
  <!-- press start -->
  <text x="40" y="188" class="t" font-size="14" fill="#ffeb3b" letter-spacing="2">PRESS START
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
