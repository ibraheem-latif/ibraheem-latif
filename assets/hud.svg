<svg xmlns="http://www.w3.org/2000/svg" width="840" height="120" viewBox="0 0 840 120" role="img" aria-label="High scores">
  <defs>
    <style>
      .px { shape-rendering: crispEdges; }
      .t { font-family: "Courier New", Courier, monospace; font-weight: 700; }
    </style>
  </defs>
  <rect width="840" height="120" fill="#0b0f1a"/>
  <rect x="8" y="8" width="824" height="104" fill="none" stroke="#2e7d32" stroke-width="4" class="px"/>
  <rect x="16" y="16" width="808" height="88" fill="none" stroke="#1b5e20" stroke-width="2" class="px"/>

  <text x="36" y="44" class="t" font-size="14" fill="#9e9e9e" letter-spacing="2">HIGH SCORES</text>

  <!-- slot 1 -->
  <text x="36" y="84" class="t" font-size="28" fill="#ffeb3b">30K+</text>
  <text x="36" y="100" class="t" font-size="11" fill="#80deea" letter-spacing="1">SUKOON LIFE USERS</text>
  <rect x="30" y="56" width="6" height="6" fill="#ffeb3b" class="px"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

  <!-- slot 2 -->
  <text x="246" y="84" class="t" font-size="28" fill="#69f0ae">150+</text>
  <text x="246" y="100" class="t" font-size="11" fill="#80deea" letter-spacing="1">BALLR PLAYERS</text>

  <!-- slot 3 -->
  <text x="436" y="84" class="t" font-size="28" fill="#90caf9">7 YRS</text>
  <text x="436" y="100" class="t" font-size="11" fill="#80deea" letter-spacing="1">SHIPPING SOFTWARE</text>

  <!-- slot 4 -->
  <text x="626" y="84" class="t" font-size="28" fill="#ff8a65">2</text>
  <text x="626" y="100" class="t" font-size="11" fill="#80deea" letter-spacing="1">APPS IN THE STORES</text>

  <!-- coin -->
  <g class="px" transform="translate(770,40)">
    <animateTransform attributeName="transform" type="translate" values="770,40;770,34;770,40" dur="0.9s" repeatCount="indefinite"/>
    <rect x="4" y="0" width="12" height="4" fill="#ffd54f"/>
    <rect x="0" y="4" width="20" height="12" fill="#ffd54f"/>
    <rect x="4" y="16" width="12" height="4" fill="#ffd54f"/>
    <rect x="8" y="6" width="4" height="8" fill="#f57f17"/>
  </g>
  <text x="762" y="78" class="t" font-size="11" fill="#9e9e9e">1UP</text>
</svg>
